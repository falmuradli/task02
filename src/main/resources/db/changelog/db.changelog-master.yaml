databaseChangeLog:
  - changeSet:
      id: 1
      author: developer
      changes:
        - createTable:
            tableName: customers
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
              - column:
                  name: email
                  type: VARCHAR(255)
              - column:
                  name: phone
                  type: VARCHAR(50)

  - changeSet:
      id: 2
      author: task02
      changes:
      - addNotNullConstraint:
          tableName: customers
          columnName: name
          columnDataType: VARCHAR(255)

      - addNotNullConstraint:
          tableName: customers
          columnName: email
          columnDataType: VARCHAR(255)

      - addNotNullConstraint:
          tableName: customers
          columnName: phone
          columnDataType: VARCHAR(50)

      - addUniqueConstraint:
          tableName: customers
          columnNames: email
          constraintName: uq_customers_email


