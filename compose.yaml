services:
  postgres:
    image: postgres:17
    container_name: task02-postgres
    environment:
      POSTGRES_DB: task02_db
      POSTGRES_USER: task02_user
      POSTGRES_PASSWORD: task02_password

    ports:
      - "5433:5432"
    volumes:
      - task02_pgdata:/var/lib/postgresql/data

volumes:
  task02_pgdata: